name: CI

# Validation only. Add a deploy job (see ../prasetya-webworks/.github/workflows/deploy.yml) once the subdomain hosting is ready.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate
        run: npm run validate
      - name: Build
        run: npm run build
